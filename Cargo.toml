[package]
name = "complexity"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde-pickle = "1.0"
savefile = "0.10.1"
fstrings = "0.2.3"
zerocopy = { version = "0.8", features = ["derive"] }
bincode = "1.3.3"
memmap2 = "0.9.12"


[profile.release]
debug = true
